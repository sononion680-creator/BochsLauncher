name: Build lBochs UI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Install Native NDK Compiler
      run: |
        sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529" "build-tools;30.0.3" "platforms;android-30"

    - name: Run Native Build Toolchain
      run: |
        export ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/21.4.7075529
        export PATH=$ANDROID_NDK_HOME:$PATH
        
        # Explicitly force ndk-build to treat the current root folder as the project directory
        ndk-build NDK_PROJECT_PATH=.

    - name: Upload Finished Binaries
      uses: actions/upload-artifact@v4
      with:
        name: lBochs-Launcher-Output
        path: |
          **/*.apk
          **/*.so
          bin/**/*.apk
          
