name: Build lBochs UI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Diagnostic Step: Prints out every single folder and file path so we can find exactly where Android.mk is hiding
    - name: Trace Repository File Layout
      run: |
        echo "=== SCANNING BOCHSLAUNCHER PATHS ==="
        find . -maxdepth 4 -not -path '*/.*'
        
